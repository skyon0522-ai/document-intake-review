[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intake-review"
version = "0.1.0"
description = "Local, version-bound review gate for actual Docling document intake"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["docling-slim[format-markdown,format-html]==2.135.0", "docling-core==2.101.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "ruff==0.14.0"]

[project.scripts]
intake-review = "intake_review:main"

[tool.setuptools]
py-modules = ["intake_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I"]
