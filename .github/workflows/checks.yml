name: Build and verify copied source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dependencies-lock.txt
      - name: Build and install the copied packages
        run: python tools/install_source.py
      - name: Verify the installed composition and review workflow
        run: .v/bin/python tools/verify_source.py --installed-only --label ci --reference-dir .
      - name: Run the installed CLI demo
        run: |
          mkdir -p .verification/ci-demo
          .v/bin/python tools/demo.py \
            --workspace .verification/ci-demo/workspace \
            --receipt .verification/ci-demo/receipt.json \
            --html .verification/ci-demo/result.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-composition-observations
          include-hidden-files: true
          path: |
            .source-build/linux/install.json
            .verification/ci/verification.json
